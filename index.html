<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroWidget 3 — Voice Input</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .widget-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 8px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        .widget-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        .widget-output {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #ccc;
            background: #fafafa;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .widget-button {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            background: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
        }

        .widget-button:hover {
            background: #005fa3;
        }
    </style>
</head>

<body>
    <div class="widget-container">
        <div class="widget-title">MicroWidget 3 — Voice Input</div>

        <div id="output" class="widget-output">
            Tap “Start Voice” and speak.
        </div>

        <button class="widget-button" onclick="startVoice()">
            Start Voice
        </button>
    </div>

    <script>
        function startVoice() {
            const output = document.getElementById("output");

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                output.textContent = "Voice input not supported on this browser.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = "en-US";
            recognition.interimResults = false;

            output.textContent = "Listening...";

            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                output.textContent = transcript;
            };

            recognition.onerror = () => {
                output.textContent = "Voice input error.";
            };
        }
    </script>
</body>
</html>
