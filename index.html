<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Speech to Text Recorder</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: none;
        -webkit-text-size-adjust: 100%;
    }

    h1 {
        margin: 0 0 12px 0;
        text-align: left;            /* FIXED: left aligned */
        font-size: 24px;
        font-weight: 600;
    }

    #output {
        width: 100%;
        min-height: 140px;
        background: #f7f7f7;         /* FIXED: light gray output area */
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;               /* FIXED: right padding included */
        box-sizing: border-box;
        font-size: 16px;
        margin-bottom: 12px;
        white-space: pre-wrap;
    }

    #startBtn {
        display: inline-block;       /* FIXED: auto-width */
        background: #0078ff;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        text-align: left;            /* FIXED: left aligned */
    }

    /* Remove blue highlight ring on iPhone */
    #startBtn:focus,
    #output:focus {
        outline: none;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
    }
</style>
</head>

<body>
    <h1>Speech to Text Recorder</h1>

    <div id="output">Tap the button and start speaking…</div>

    <button id="startBtn">Start Recording</button>

    <script>
        const output = document.getElementById("output");
        const startBtn = document.getElementById("startBtn");

        let recognition;

        if ("webkitSpeechRecognition" in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = "en-US";

            recognition.onresult = function(event) {
                let transcript = "";
                for (let i = 0; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                output.textContent = transcript;
            };

            recognition.onerror = function(event) {
                output.textContent = "Error: " + event.error;
            };
        } else {
            output.textContent = "Speech recognition not supported on this browser.";
        }

        startBtn.onclick = function() {
            if (recognition) {
                recognition.start();
                output.textContent = "Listening…";
            }
        };
    </script>
</body>
</html>
